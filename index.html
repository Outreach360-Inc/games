<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎲 Game Zone</title>
<meta content="noindex, nofollow" name="robots"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32"
      href="https://github.com/Outreach360-Inc/games/raw/main/favicon.png">
<link rel="icon" type="image/png" sizes="16x16"
      href="https://github.com/Outreach360-Inc/games/raw/main/favicon.png">

<style>
  :root{
    --purple:#6a3bd1; --purple-dark:#4d26a8; --ink:#1e2430;

    /* CTA colors */
    --cta1:#ff7a1a; --cta1b:#ea4235;
    --cta2:#89c83b; --cta2b:#6aae22;
    --cta3:#2b7a64; --cta3b:#145a46;
    --cta4:#41b5e6; --cta4b:#268fc0;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Nunito", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    color:var(--ink);
    background:linear-gradient(90deg,#1ea2ff 0%,#8fd2ff 52%,#c6f3ff 100%);
  }

  /* Exactly one screen tall, split into three rows */
  .screen{
    height:100svh;                      /* mobile-safe viewport */
    display:grid;
    grid-template-rows:minmax(0,1fr) auto auto; /* hero grows, band + ctas size to content */
    overflow:hidden;                    /* avoid scrollbars */
  }

  /* 1) HERO */
  .hero{ position:relative; overflow:hidden; }
  .hero img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; object-position:center;
    display:block;
  }

  /* 2) PURPLE BAND */
  .band{
    background:linear-gradient(0deg, var(--purple), var(--purple-dark));
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:"Baloo 2", system-ui, sans-serif;
    font-weight:800; text-transform:uppercase; letter-spacing:.35em;
    font-size:clamp(12px,2.1vw,22px);
    padding:.55em 1em;
    border-top:6px solid #fff;          /* white rules like your image */
    border-bottom:6px solid #fff;
    text-align:center;
  }

  /* 3) CTAs on white */
  .ctas{
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(10px,1.6vh,18px) 14px clamp(14px,2vh,22px);
  }
  .cta-row{
    width:min(1180px, 96%);
    display:grid; gap:clamp(12px,1.4vw,18px);
    grid-template-columns:repeat(4,1fr);
  }
  @media (max-width: 980px){ .cta-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width: 520px){ .cta-row{ grid-template-columns:1fr; } }

  .cta{
    display:flex; align-items:center; justify-content:center;
    text-align:center; text-decoration:none; color:#fff;
    font-weight:1000; text-transform:uppercase; letter-spacing:.03em;
    font-size:clamp(14px,1.6vw,22px);
    line-height:1.15;
    padding:clamp(10px,1.4vh,14px) clamp(14px,2vw,18px);
    min-height:56px;
    border-radius:999px;
    box-shadow:0 12px 0 rgba(0,0,0,.18), 0 18px 26px rgba(0,0,0,.20);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .cta:hover{ filter:brightness(1.04) }
  .cta:active{ transform:translateY(1px); box-shadow:0 9px 0 rgba(0,0,0,.18) }

.cta{
  /* use per-button variables defined below */
  background: radial-gradient(120% 180% at 50% 0%,
              var(--grad1) 0%, var(--grad2) 55%, var(--grad3) 100%);
  box-shadow:
    inset 0 -3px 0 rgba(0,0,0,.12),
    0 5px 0 var(--shadow-base),
    0 12px 18px rgba(0,0,0,.20);
  text-shadow: 0 1px 0 rgba(0,0,0,.15);
}
.cta:active{
  transform: translateY(1px);
  box-shadow:
    inset 0 -2px 0 rgba(0,0,0,.12),
    0 4px 0 var(--shadow-base);
}

/* Per-button color tokens (tweak to taste) */
.cta--red{
  --grad1:#ff8a7a; --grad2:#ea4235; --grad3:#b11c2d; --shadow-base:#8f1f2f;
}
.cta--green{
  --grad1:#c7e97f; --grad2:#89c83b; --grad3:#5a8f1f; --shadow-base:#4d7e17;
}
.cta--teal{
  --grad1:#77c9b5; --grad2:#2b7a64; --grad3:#0f5543; --shadow-base:#0e4434;
}
.cta--blue{
  --grad1:#7ed4f2; --grad2:#41b5e6; --grad3:#1b6f97; --shadow-base:#1a5f82;
}
  /* Make sure short screens still fit (hero will shrink first) */
  @media (max-height: 640px){
    .cta{ min-height:50px; }
    .band{ font-size:clamp(11px,2vw,18px); padding:.45em .9em; }
  }
</style>
</head>
<body>

  <div class="screen">
    <!-- Row 1: HERO -->
    <section class="hero" aria-label="Outreach360 Game Zone">
      <img src="https://github.com/Outreach360-Inc/games/blob/main/game-zone-hero9.png?raw=true"
           alt="Outreach360 Game Zone banner with students and emojis">
    </section>

    <!-- Row 2: PURPLE SELECT BAND -->
    <div class="band">Select Your Program</div>

    <!-- Row 3: CTAs (on white) -->
    <section class="ctas" aria-label="Programs">
      <nav class="cta-row">
        <a class="cta cta--red"   href="https://outreach360-inc.github.io/games/game-zone-hh1-4.html">Hand in Hand 1–4</a>
        <a class="cta cta--green" href="https://outreach360-inc.github.io/games/game-zone-hh5-6.html">Hand in Hand 5–6</a>
        <a class="cta cta--teal"  href="https://outreach360-inc.github.io/games/game-zone-discover.html">Oxford Discover<br>or English Link</a>
        <a class="cta cta--blue"  href="https://outreach360-inc.github.io/games/game-zone-futures.html">Oxford Discover<br>Futures (Teens)</a>
      </nav>
    </section>
  </div>


<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const isEmbeddedShell = window.self !== window.top && !params.has('gz_inner');

  // Direct visits behave exactly as before.
  // The inner copy also behaves normally; the outer shell controls it.
  if (!isEmbeddedShell) return;

  // Turn this page into a same-origin navigation shell only when embedded.
  document.body.innerHTML = '';
  document.body.style.margin = '0';
  document.body.style.width = '100%';
  document.body.style.height = '100vh';
  document.body.style.overflow = 'hidden';

  const gameFrame = document.createElement('iframe');
  gameFrame.id = 'gameZoneInnerFrame';
  gameFrame.title = 'Outreach360 Game Zone';
  gameFrame.style.width = '100%';
  gameFrame.style.height = '100%';
  gameFrame.style.border = '0';
  gameFrame.style.display = 'block';
  gameFrame.setAttribute('allowfullscreen', '');

  // Load a second copy of this page as the visible Game Zone homepage.
  // gz_inner prevents that copy from creating another nested iframe.
  const startUrl = new URL(window.location.href);
  startUrl.searchParams.set('gz_inner', '1');
  gameFrame.src = startUrl.href;

  document.body.appendChild(gameFrame);

  function installNavigationGuard() {
    try {
      const childWindow = gameFrame.contentWindow;
      const childDocument = gameFrame.contentDocument;

      if (!childWindow || !childDocument) return;

      // This only works while the loaded page is on the same GitHub Pages origin.
      // That is exactly what we need to intercept the Game Zone's own links.
      if (childWindow.location.origin !== window.location.origin) return;

      function isSpecialLink(href) {
        return !href ||
          href.startsWith('#') ||
          href.startsWith('mailto:') ||
          href.startsWith('tel:') ||
          href.startsWith('javascript:');
      }

      function forceTargets() {
        childDocument.querySelectorAll('a[href]').forEach(function (link) {
          const href = link.getAttribute('href');
          if (!isSpecialLink(href)) {
            link.setAttribute('target', '_self');
          }
        });

        childDocument.querySelectorAll('form').forEach(function (form) {
          form.setAttribute('target', '_self');
        });
      }

      forceTargets();

      // Catch dynamically-created links.
      const observer = new MutationObserver(forceTargets);
      observer.observe(childDocument.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['target']
      });

      // Catch normal links and links with target="_blank" before their own handlers run.
      childDocument.addEventListener('click', function (event) {
        const link = event.target.closest && event.target.closest('a[href]');
        if (!link) return;

        const rawHref = link.getAttribute('href');
        if (isSpecialLink(rawHref)) return;

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        // Navigate the INNER iframe, never the browser tab.
        gameFrame.src = link.href;
      }, true);

      // Catch JavaScript such as window.open(url, '_blank').
      childWindow.open = function (url) {
        if (url) {
          gameFrame.src = new URL(url, childWindow.location.href).href;
        }
        return childWindow;
      };

      // Keep forms in the inner iframe as well.
      childDocument.addEventListener('submit', function (event) {
        const form = event.target;
        if (form && form.tagName === 'FORM') {
          form.setAttribute('target', '_self');
        }
      }, true);

    } catch (error) {
      // Once an external site is loaded, browser cross-origin rules prevent
      // us from inspecting that external page. The navigation itself remains
      // inside the iframe.
    }
  }

  // Re-install the guard every time the inner iframe navigates to another
  // same-origin Game Zone page.
  gameFrame.addEventListener('load', installNavigationGuard);
})();
</script>

</body>
</html>
